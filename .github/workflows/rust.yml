# BeatBox, checked on every push and pull request.
#
# Linux and Windows, because both are shipped and each has had bugs the
# other did not. The toolchain comes from rust-toolchain.toml,
# which rustup on both runners reads on its own.

name: rust

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked

  dependencies:
    # Licences, advisories, sources, and the crate graph (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    # The page (web/, plan R5). dist/ is committed so that building BeatBox
    # needs no Node, and the window embeds it: a src/ change nobody built is
    # a window showing yesterday's page, so a rebuild that differs fails here.
    # Then the static checks on the page, its locales and its contract.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web dependencies
        run: npm ci
      - name: Translation catalogues and generated keys
        run: npm run locales:check
      - name: Build
        run: npm run build
      - name: The committed bundle is the one the source builds
        run: git diff --exit-code -- dist
      - name: Tests
        run: npm test

  shell:
    # The window (shell/, plan R4): a workspace of its own, with Tauri in it,
    # so it needs the system webview's headers to build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - name: WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --features proof --locked
      - name: Tests
        run: cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: shell/Cargo.toml
